name: CI

# Typecheck, tests and lint for the ORM and the template that exercises it.
#
# **Why this exists.** `feat/orm` stopped typechecking at #102 and stayed broken
# across six merges (#101–#109) with every test green the whole time. The break
# was a *semantic* merge conflict: #92 added a three-argument
# `UnsupportedQueryError` while `detail` was optional, #102 made `detail`
# required and fixed the call sites on its own branch. Neither touched the
# other's file, so there was no textual conflict, no diff for a reviewer to look
# at, and nothing that runs on the result of merging them.
#
# That is a class a per-PR check cannot cover on its own — it only appears once
# both are on the same branch — which is why this runs on pushes to the
# integration branches as well as on pull requests.
#
# **Two jobs, one per dialect**, and the split is forced rather than tidy.
# `@prisma/client` is generated for one provider at a time and the differential
# harness refuses the dialect it was not generated for, so the two cannot share
# a checkout. `sqlite` runs the package and the dialect-agnostic suites;
# `postgres` brings up a `postgres:16` service container and runs the
# dialect-labelled ones. The reasoning is written out at the `postgres:` job
# below, next to the `-t postgres` filter it justifies.
#
# On a developer's machine there is no service container, and the harness skips
# its Postgres half loudly when `TEST_POSTGRES_URL` is unset — so a local run is
# honest about covering SQLite only.
on:
  pull_request:
  push:
    branches: [main, next, feat/orm]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: sqlite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, and pinned to the same version `publish.yml` builds the
          # package with — so what CI proves is what ships, rather than two
          # runtimes that happen to agree today.
          #
          # It was `latest`, which is how 1.4.0 arrived on 2026-08-21 and turned
          # this job red on a commit nobody had touched. Bun's SQLite driver
          # started **throwing** on an object binding where it used to bind it,
          # and `raw-sql.test.ts` asserts a forged fragment binds and matches
          # nothing. The guard it covers still holds — 1.4.0 arguably holds it
          # harder, by refusing rather than binding something meaningless — but
          # the assertion is written for the old behaviour.
          #
          # Not pinned to `packageManager` (bun@1.1.3), which is behind what the
          # repo is actually developed against.
          #
          # **Moving this is a deliberate act.** Raise it and run the suite
          # rather than letting a runtime release do it on a Saturday; the two
          # `raw-sql.test.ts` assertions are the known thing to fix when this
          # goes to 1.4.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # The ORM generator is resolved by bin name, and in this repo that symlink
      # points at built output — so `prisma generate` below needs it to exist.
      - name: Build the binaries
        run: bun run build:bin
        working-directory: packages/gemi

      # `bun install` does not leave a usable `gemi-orm-generator` behind, and
      # `prisma generate` resolves the generator **by bin name**.
      #
      # Two behaviours combine. At install time the target does not exist yet —
      # `dist/bin/` is produced by the step above — so the link is not created.
      # And a second `bun install` does not fix it: with the lockfile satisfied
      # it reports "no changes" and relinks nothing, which is measurable
      # locally by deleting the link and re-running install.
      #
      # So the link is made here, after the file exists. Not a CI quirk: a fresh
      # clone hits exactly this, which is what the first run of this workflow
      # discovered.
      # Both places, and each for its own reason. The root one is what
      # `prisma generate` resolves through; the template one is what
      # `generated.test.ts` asserts exists, because that is where a real
      # installation would put it.
      - name: Link the ORM generator
        run: |
          for dir in node_modules templates/saas-starter/node_modules; do
            mkdir -p "$dir/.bin"
            ln -sf "$PWD/packages/gemi/dist/bin/orm-generator.js" \
                   "$dir/.bin/gemi-orm-generator"
          done
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # The template's committed artifact is what its suite runs against, and
      # `generated.test.ts` asserts a second run produces a zero-line diff.
      #
      # This runs against `prisma/schema.prisma`, which has **no**
      # `generator client` block — so it is also the check that the client-free
      # path an application uses actually works. If the emitted bases ever went
      # back to needing Prisma's types, this step would still pass and the
      # typecheck below would fail; if `prisma generate` itself came to need a
      # client, this step fails here.
      - name: Generate the template's model artifact
        run: bunx prisma generate
        working-directory: templates/saas-starter

      # The differential harness compares gemi against Prisma, so it needs a
      # Prisma client — generated from `differential.prisma`, which is
      # `schema.prisma` plus a client block and nothing else. Uncommitted, like
      # every generated client in this repo.
      #
      # **Run from the repository root, not from the template**, and the reason
      # is not obvious. `prisma generate` decides whether `@prisma/client` is
      # installed by reading the *nearest package.json* rather than by resolving
      # the module: from `templates/saas-starter`, whose manifest deliberately no
      # longer names it, Prisma concludes it is missing and runs
      # `npm i @prisma/client`, which fails. The root manifest declares it — it
      # is a dependency of gemi's test suite — so from here Prisma is satisfied
      # and resolution finds the hoisted copy.
      #
      # The template not declaring it is the point of this whole arrangement, so
      # the fix is to generate from the package that does.
      - name: Generate the differential harness's Prisma client
        run: bunx prisma generate --schema templates/saas-starter/prisma/differential.prisma

      # The step that would have caught #159. Kept before the tests, because a
      # type error is cheaper to read than a suite that still passes around it.
      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/gemi

      # The generator's *output*, compiled against the runtime it is generated
      # for. The step above covers `bin/orm` — the code that writes the artifact
      # — and not the artifact, and the two can disagree: #319 shipped a
      # `static $generated = true` that widened to `boolean` against a base
      # declaring `?: true`, so every emitted class was a TS2417 and every check
      # here was green. It was found by an app regenerating a 79-model schema.
      #
      # After `prisma generate` above, so it reads the artifact this run
      # produced rather than the one that happens to be committed.
      - name: Typecheck the generated artifact
        run: bunx tsc --noEmit -p tsconfig.generated.json
        working-directory: packages/gemi

      # Everything except a named red set, rather than a path filter.
      #
      # This step used to run `vitest run orm database`, chosen so
      # `database/DatabaseManager.test.ts` — the ORM's own SQLite foreign-key
      # pragma test — was not skipped by the narrower `orm`. The reason given
      # for not running the whole package was that `app/`'s router tests fail on
      # `feat/orm` and are unrelated (#163), and a board that is red for a
      # reason nobody here can act on stops being read.
      #
      # That reason covers six files. The filter excluded fourteen: `container`,
      # `foundation`, `http`, `support`, `app/App` and three of the router
      # tests all pass and were never run — 55 of the package's 61 files are
      # green, and CI was running 47 of them.
      #
      # An inclusive filter also fails silently in one direction: a new test
      # file outside those two words is skipped and nothing says so. That is how
      # #201's type assertions went unnoticed. Naming what is broken instead
      # means anything added is covered by default, and the exclusions have to
      # be deleted for CI to stop being honest rather than merely left alone.
      #
      # The six exclusions #163 carried here are gone, and so is #163. They were
      # three different problems wearing one label: three superseded copies in
      # `app/` that nothing imported (deleted), a stale assertion about the live
      # router (corrected), and a test file written against `bun:test` that this
      # runner could not even collect (ported, and it found two real things).
      # `services/router/createFlatViewRoutes.test.ts` was excluded while
      # passing.
      #
      # The whole package runs now. Keep it that way: an exclusion added here is
      # a failure nobody will look at again, which is the state this comment
      # replaced.
      - name: Unit tests
        run: bun --bun vitest run
        working-directory: packages/gemi

      - name: Template tests
        run: bun --bun vitest run app/models
        working-directory: templates/saas-starter
        env:
          TZ: UTC

      # `gemi check models`, against the one real project in this repository.
      #
      # `check-models.test.ts` covers the command over a fixture project, so
      # what is left for this step is the one thing a fixture cannot do:
      # resolve the app's *installed* `gemi/orm` — the same instance the model
      # files register into — rather than the copy bundled into
      # `dist/bin/gemi.js`. Get that wrong and the command reads an empty
      # registry, finds nothing to report, and exits 0.
      #
      # Which is why the count is asserted rather than the exit code. A green
      # run and a run that checked nothing print the same *shape* of line, and
      # differ only in the number in it.
      #
      # `--ignore bench` because `app/models/bench/` is a benchmark harness that
      # runs on import — which the command found by running it, and rewriting its
      # report, the first time it was pointed at this directory. That is the
      # hazard the flag exists for, so exercising the flag here is not
      # incidental.
      - name: Check the template's model registrations
        run: |
          output=$(bunx gemi check models --ignore bench)
          echo "$output"
          echo "$output" | grep -qE 'against [1-9][0-9]* registered models'
        working-directory: templates/saas-starter
        env:
          TZ: UTC

      # `gemi run`, against the one real project in this repository.
      #
      # `console/runner.test.ts` covers the runner over fixture projects, so what
      # is left is what a fixture cannot do. Its command files import
      # `defineCommand` by absolute path, which makes the class identity hold by
      # construction; a real project imports it from its *installed* gemi, while
      # the CLI runs from `dist/bin/gemi.js` with a bundled copy of its own.
      # Discovery decides what is a command by walking the prototype chain, so
      # if `gemi run` ever stops spawning a process and resolving the runner out
      # of the app's own `node_modules`, every command in every project becomes
      # invisible — and every unit test still passes.
      #
      # The template ships no commands, so this asserts the empty-directory
      # listing: enough to prove the spawn, both preloads, the app's Kernel and
      # the config slice all lined up. Add a command to `app/commands/` here and
      # this becomes an end-to-end assertion.
      #
      # `timeout 60` because the second failure this covers is a command that
      # finishes its work and then sits there — an open database pool, a Redis
      # client or a cron handle holding the loop open. Without the bound that is
      # a six-hour job rather than a red step.
      - name: Run the console command runner
        run: |
          output=$(timeout 60 bunx gemi run)
          echo "$output"
          echo "$output" | grep -q 'app/commands'
          if timeout 60 bunx gemi run no-such-command; then
            echo "expected a non-zero exit for an unknown command"; exit 1
          fi
        working-directory: templates/saas-starter
        env:
          TZ: UTC

      # `.test-d.ts` files do not match vitest's default `include`, so the step
      # above collects none of them: 15 type assertions in `wrap.test-d.ts` and
      # `aggregate.test-d.ts` ran nowhere, locally or here. They are the only
      # check on the compile-time half of the ORM's pitch — that `wrap` refuses
      # a partial row, and that a narrowed `select` narrows the result type.
      #
      # `ignoreSourceErrors` because the template's own app code has 276 type
      # errors unrelated to the ORM. Without it this step reports them and
      # fails, which is why it could not simply be switched on; with it, the
      # scope is exactly the assertions in the `.test-d.ts` files.
      - name: Template type tests
        run: bun run test:types
        working-directory: templates/saas-starter
        env:
          TZ: UTC

      # Two lints, because the package and the ORM are in different states.
      #
      # `bun run lint` is `oxlint` over the whole package: 88 warnings, 0
      # errors, so it passes — and a new warning in `orm/` would be one of 89.
      # Kept, because the errors it would catch are worth catching.
      #
      # `orm/` is at zero after #165, so it can be held there. `--deny-warnings`
      # makes that a build failure rather than a line nobody reads. Scoped to
      # `orm/` deliberately: the rest of the package is not this series' to
      # clean up, and a check that is red for someone else's reasons stops
      # being read — the argument #163 makes about the suite.
      - name: Lint
        run: bun run lint
        working-directory: packages/gemi

      - name: Lint the ORM at zero warnings
        run: bunx oxlint orm --deny-warnings
        working-directory: packages/gemi

      # The published package, installed into an application and typechecked —
      # the only check here that compiles against a tarball rather than against
      # the source tree. `exports-map.test.ts` reads source paths and says in
      # its own comment that it cannot see `dist/`; `build-publish.ts` checks
      # that files exist in the staging directory. Both were green for every
      # release that shipped a scaffold pointing at a `gemi.d.ts` the tarball
      # did not contain, because neither installs anything.
      #
      # **Last, and on its own.** It runs `bun run build:publish`, which deletes
      # and recreates `dist/` — so anything after it that shells out to
      # `dist/bin/gemi.js` would report a missing module if the build failed,
      # burying the real cause. Held out of the `Unit tests` step by
      # `vitest.config.ts` for the same reason, plus not putting a full
      # framework build in parallel with the timing-sensitive ORM suites.
      - name: Packaging test
        run: bun run test:packaging
        working-directory: packages/gemi

  # The other half of the differential harness, which is the repository's actual
  # correctness claim: every query run through Prisma *and* through gemi against
  # one database, compared on rows and on table contents.
  #
  # It only runs when `TEST_POSTGRES_URL` is set, and it is loud rather than
  # silent when it does not — but "loud" only helps someone who is watching, and
  # until now nothing was. The lateral relation strategy is the Postgres
  # default, so an entire strategy was exercised only when a person remembered
  # to export the variable.
  #
  # A separate job rather than a step, because the two cannot share a checkout:
  # `@prisma/client` is generated for one provider at a time, and the harness
  # refuses to run the dialect it was not generated for rather than skipping.
  postgres:
    name: postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gemi_test
        ports: ["5432:5432"]
        # Without this the first query races the server's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No `?schema=public`: Bun's SQL client rejects it as an unrecognised
      # parameter, which reads as a connection failure rather than a bad URL.
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/gemi_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gemi_test
      # The scalar-list schema's own database — see the two steps that create
      # and push it. A second database rather than a second set of tables,
      # because `prisma db push` reconciles a whole database to one schema.
      TEST_POSTGRES_LISTS_URL: postgres://postgres:postgres@localhost:5432/gemi_lists
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Same version as the sqlite job and `publish.yml`; see the note there.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the binaries
        run: bun run build:bin
        working-directory: packages/gemi

      - name: Link the ORM generator
        run: |
          for dir in node_modules templates/saas-starter/node_modules; do
            mkdir -p "$dir/.bin"
            ln -sf "$PWD/packages/gemi/dist/bin/orm-generator.js" \
                   "$dir/.bin/gemi-orm-generator"
          done
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # The provider decides which client Prisma emits, and the harness compares
      # against that client. Switched here rather than committed, so the
      # repository stays on sqlite for everyone else.
      - name: Point the schema at Postgres
        run: sed -i 's/^  provider = "sqlite"/  provider = "postgresql"/' prisma/schema.prisma
        working-directory: templates/saas-starter

      # `differential.prisma` is derived from the schema edited above, so it has
      # to be re-derived rather than left holding a sqlite datasource. Deriving
      # it here also keeps it consistent with `schema.prisma` for
      # `app-dependencies.test.ts`, which compares the two.
      - name: Re-derive the differential schema
        run: bun prisma/differential-schema.ts
        working-directory: templates/saas-starter

      - name: Generate for Postgres
        run: bunx prisma generate
        working-directory: templates/saas-starter

      # The harness's client, which is what the differential suites compare
      # against — and it speaks one provider at a time, which is why it is
      # generated after the schema was pointed at Postgres. Run from the root
      # for the reason the sqlite job gives at length: Prisma reads the nearest
      # package.json to decide whether the client is installed, and the
      # template's deliberately does not name it.
      - name: Generate the differential harness's Prisma client
        run: bunx prisma generate --schema templates/saas-starter/prisma/differential.prisma

      - name: Create the schema
        run: bunx prisma db push --skip-generate
        working-directory: templates/saas-starter

      # `prisma/postgres-only.prisma` — the scalar lists (#300), which cannot
      # live in the schema above because a `String[]` is a *validation error* on
      # SQLite, and that schema has its provider flipped between dialects. So
      # they get their own schema, their own client and their own database.
      #
      # A separate database because `prisma db push` reconciles a whole database
      # to one schema: pushed at `gemi_test`, it would drop every table the main
      # schema owns and the rest of this job would fail with missing relations.
      #
      # Skipping this step does not fail anything — `scalar-list.test.ts` gates
      # on `TEST_POSTGRES_LISTS_URL` — so it would read as a pass. That is
      # exactly the silence `postgres-suite-selection.test.ts` exists to catch,
      # and the suite prints a loud warning when it does not run.
      # `|| true` for the same reason `app/models/postgres.sh` has one: a
      # re-created database is an error rather than a no-op, so a rerun against
      # a persisted service container would fail a step that is not the point of
      # the job. A fresh container makes it succeed the first time either way.
      - name: Create the scalar-list database
        run: >-
          PGPASSWORD=postgres psql -h localhost -U postgres -d gemi_test
          -c 'CREATE DATABASE gemi_lists' || true

      # Two generates, split the same way the main schema is: the gemi artifacts
      # from `postgres-only.prisma` in the template, and the Prisma client the
      # scalar-list suite compares against from its derived counterpart, at the
      # root — because `prisma generate` reads the *cwd's* package.json to decide
      # whether `@prisma/client` is installed, and the template's no longer
      # names it.
      - name: Generate and push the scalar-list schema
        run: |
          (cd templates/saas-starter && bunx prisma generate --schema prisma/postgres-only.prisma)
          bunx prisma generate --schema templates/saas-starter/prisma/postgres-only-differential.prisma
          (cd templates/saas-starter && bunx prisma db push --schema prisma/postgres-only.prisma --skip-generate)
        env:
          LISTS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gemi_lists

      # `-t postgres` selects the dialect-labelled suites, and it is required
      # rather than tidy. `@prisma/client` speaks one provider at a time, and
      # `Generate for Postgres` above makes it Postgres — so the *SQLite* half
      # of each differential suite **fails** rather than skips, deliberately,
      # so a client generated for the wrong provider cannot look like a pass.
      # `TEST_POSTGRES_URL` decides only whether the Postgres half runs at all;
      # the generate step is what decides which half dies. So an unfiltered run
      # here exits 1 no matter how many tests pass, and the failures are the
      # ones the setup above guarantees.
      #
      # So this job runs the Postgres-labelled suites and the `sqlite` job runs
      # the rest. The dialect-agnostic tests are that job's business; nothing is
      # left uncovered between them — which was false for three files until
      # #206, and is guarded now by `postgres-suite-selection.test.ts`.
      #
      # Serially: the harness truncates shared tables between cases, so parallel
      # files clobber each other's fixtures. Measured — the parallel run fails
      # with row-count differences that have nothing to do with the code.
      - name: Differential and policy suites
        run: bun --bun vitest run app/models --no-file-parallelism -t postgres
        working-directory: templates/saas-starter
